<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design layout</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        header{
            position: sticky;
            top: 0px;
        }

        .navigation {
            position: sticky;
            background-color: pink;
            border: 0.1px solid black;
            /* margin: 0px; */
            padding: 10px;

        }

        ul li {
            list-style: none;
            padding: 15px;
            display: inline;

        }

        .box {
            border: solid black 2px;
            height: 800px;
            width: 1520px;
            background-color: aquamarine;
            /* margin: 10px 10px; */
        }

        /* .boxes {
            position:inline ;
        } */

        .box1 {
            border: 2px solid pink;
            height: 500px;
            width: 600px;
            padding: 20px;
            margin: 50px;
            display: inline-block;
            background-color: pink;

        }

        .box2 {
            border: 2px solid blue;
            height: 500px;
            width: 600px;
            padding: 20px;
            margin: 50px;
            display: inline-block;
            background-color: blue;

        }

        .border {
            border: 1px solid black;
            border-radius: 5px;
            padding: 40px;
            text-align: center;
            font-size: larger;
            margin: 5px 30px;


        }
        .footer{
            border: 1px solid plum;
            height: 30px;
            width: 1520px;
            background-color: plum;
        }
        .orangebox{
            background-color: orange;
            height: 30px;
            width: 30px;
            bottom: 30px;
            right: 10px;
            border: 0.1px solid orange;
            border-radius: 100px;
            position: fixed;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navigation">
            <ul>
                <li>Home</li>
                <li>Category</li>
                <li>More about us</li>

            </ul>

        </nav>
    </header>
    <main>
        <div class="box">
            <div class="boxes">
                <div class="box1"></div>
                <div class="box2"></div>

            </div>


        </div>
        <div>
            <div class="border">
                <h2> Welcome To This Sigma Web Development Express</h2>

            </div>

        </div>
    </main>
    <footer>
        <div class="footer">

        </div>
        <div class="orangebox">

        </div>
    </footer>



</body>

</html>
