<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS multicolor website</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <style>
        :root {
            --primary-color: rgb(220, 239, 254);
            --text-color: rgb(248, 194, 96);
            --secondary-color: rgb(127, 197, 250);
        }

        body {
            background-color: var(--secondary-color);
        }

        * {
            padding: 0px;
            margin: 0px;
            font-family: 'Poppins', sans-serif;
        }

        nav {
            background-color: var(--primary-color);
        }

        li {
            list-style: none;
            display: inline-flex;
            padding: 12px;
            font-weight: bold;
            color: var(--text-color);
            font-size: large;
        }

        ul li a {
            color: var(--text-color);
            text-decoration: none;
        }

        ul li a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact Us</a></li>
            </ul>
        </nav>
    </header>


</body>

</html>
