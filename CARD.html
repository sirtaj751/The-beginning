<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD</title>
    <style>
       
           
        
        body{
            background-color:gray;
            
        }
        .card{
            background-color: wheat;
            padding: 0 0 60px;
            width: 330px;
            border-radius: 3%;
        }
        .image{
            padding: 20px;
            
        }
        .image img{
            border-radius: 2%;
        }
        .content{
            padding:10px;
        }
        .capsules span{
            border: 1px solid;
            padding: 0px 6px;
            border-radius: 9px;
        }
        .capsules{
            padding:0 25px ;
        }
        .button{
            text-align: center;
        }
       .button button{
        border-radius: 9px;
        padding: 5px 5px; 
        color: rgb(63, 117, 225);
        background-color: rgb(127, 174, 224);
        border: none;
        cursor: pointer;
        
       }
       .button button:hover{
        color: rgb(79, 129, 229);
        background-color: rgb(38, 62, 87);
       }
    </style>
</head>
<body>
    <div class="card">
        <div class="image">
        <img src="image.png" alt="eagle image" height="232" width="290" >
    </div>
    <div class="capsules">
        <span>Nature</span>
        <span>Bird</span>
    </div>
    <div class="content">
        <h2>Beautiful Bird</h2>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Ullam iusto fugit praesentium modi repellat voluptate ipsam tempora? Dolor debitis, blanditiis culpa nulla ad quibusdam tempore sunt saepe, error officia porro?</p>
    </div>
    <div class="button">
        <button>Read more</button>
    </div>
    </div>
    
</body>
</html>
